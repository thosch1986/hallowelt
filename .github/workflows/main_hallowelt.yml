name: Deploy static HTML to Azure Web App - hallowelt

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_277898EA999143CA80072395756AD1AB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F2B7A48697DC45B1BCBC0E768CBD51DC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4811E97E2F15453DA0B7556520300EC0 }}

      - name: Deploy static files to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hallowelt'
          slot-name: 'Production'
          package: .